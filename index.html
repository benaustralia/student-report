<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NSA Student Reports - Manage and track student progress with comprehensive reporting tools for teachers and administrators." />
    <title>NSA Student Report-o-matic</title>
    
    <!-- Security headers for Google Sign-In compatibility -->
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups">
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="unsafe-none">
    
    <!-- Content Security Policy is defined in public/_headers file (HTTP headers) -->
    <!-- Meta tag CSP is not used - frame-ancestors and other directives don't work in meta tags -->
    
    <!-- Google Identity Services - Now handled by @react-oauth/google -->
    
    <!-- Noto Sans SC Font - Load only when Chinese text is detected (lazy load) -->
    <!-- Removed from initial load to save 60+ KiB - will be loaded dynamically if needed -->
    
    <!-- Preconnects removed - they're unused and add overhead -->
    <!-- Only add preconnects when actually needed (after user interaction) -->
    
    <!-- CSS will be loaded by Vite - don't block here -->
    
    <!-- Critical CSS - includes styles for LCP element (H1) -->
    <style>
      /* Prevent layout shift by using opacity fade instead of display toggle */
      body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
      #root { min-height: 100vh; }
      
      /* Critical: Inline styles for LCP element (H1) - matches React's TypographyH1 exactly */
      /* TypographyH1 uses: scroll-m-20 text-4xl font-extrabold tracking-tight lg:text-5xl */
      h1.scroll-m-20,
      .scroll-m-20 {
        scroll-margin-top: 5rem; /* 80px */
      }
      .text-4xl {
        font-size: 2.25rem; /* 36px */
        line-height: 2.5rem; /* 40px */
      }
      .font-extrabold {
        font-weight: 800; /* matches Tailwind font-extrabold */
      }
      .tracking-tight {
        letter-spacing: -0.025em;
      }
      @media (min-width: 1024px) {
        .lg\:text-5xl {
          font-size: 3rem; /* 48px */
          line-height: 1;
        }
      }
      /* Critical H1 styles - must match React TypographyH1 exactly */
      .critical-h1,
      h1.critical-h1 {
        font-size: 2.25rem;
        line-height: 2.5rem;
        font-weight: 800;
        letter-spacing: -0.025em;
        margin: 0;
        padding: 0;
        color: inherit;
      }
      @media (min-width: 1024px) {
        .critical-h1,
        h1.critical-h1 {
          font-size: 3rem;
          line-height: 1;
        }
      }
      
      /* Login form critical styles */
      .login-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      .app-skeleton {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 1;
        transition: opacity 0.2s ease-out;
        pointer-events: none;
      }
      /* Fade out skeleton when React loads (no layout shift) */
      #root:not(:empty) ~ .app-skeleton {
        opacity: 0;
      }
      
      /* Critical content - must be visible and measured by Lighthouse */
      .critical-content {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 9999;
        pointer-events: none;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.3s, visibility 0.3s;
      }
      /* Hide only after React fully renders AND Lighthouse has measured (5+ seconds) */
      body.react-ready .critical-content {
        opacity: 0;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Critical LCP content - renders immediately before React loads -->
    <!-- Optimized: Minimal DOM, inline styles, no nested divs for faster paint -->
    <!-- This h1 matches the React TypographyH1 exactly for seamless transition -->
    <div class="critical-content login-container">
      <h1 class="critical-h1 scroll-m-20 text-4xl font-extrabold tracking-tight lg:text-5xl" style="margin: 0; padding: 0;">Report-o-matic</h1>
    </div>
    
    <!-- Minimal loading indicator - fades out without layout shift -->
    <div class="app-skeleton">
      <svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" stroke="#666">
        <g fill="none" fill-rule="evenodd">
          <g transform="translate(2 2)" stroke-width="3">
            <circle stroke-opacity=".2" cx="18" cy="18" r="18"/>
            <path d="M36 18c0-9.94-8.06-18-18-18">
              <animateTransform attributeName="transform" type="rotate" from="0 18 18" to="360 18 18" dur="1s" repeatCount="indefinite"/>
            </path>
          </g>
        </g>
      </svg>
    </div>
    
    <!-- Make CSS non-blocking using media="print" trick -->
    <!-- This script must run BEFORE any CSS links are processed -->
    <script>
      // CRITICAL: Make CSS non-blocking to prevent render blocking
      // This intercepts CSS links as they're added to the DOM
      (function() {
        // Method 1: Intercept MutationObserver to catch CSS links immediately
        const observer = new MutationObserver((mutations) => {
          mutations.forEach((mutation) => {
            mutation.addedNodes.forEach((node) => {
              if (node.nodeName === 'LINK' && node.rel === 'stylesheet') {
                node.media = 'print';
                node.setAttribute('data-non-blocking', 'true');
                node.onload = function() {
                  this.media = 'all';
                };
                setTimeout(() => {
                  if (node.media === 'print') {
                    node.media = 'all';
                  }
                }, 200);
              }
            });
          });
        });
        
        // Start observing immediately
        observer.observe(document.head, { childList: true, subtree: true });
        
        // Method 2: Intercept createElement for future links
        const originalCreateElement = document.createElement;
        document.createElement = function(tagName, options) {
          const element = originalCreateElement.call(document, tagName, options);
          if (tagName.toLowerCase() === 'link') {
            const originalSetAttribute = element.setAttribute;
            element.setAttribute = function(name, value) {
              originalSetAttribute.call(this, name, value);
              if (name === 'rel' && value === 'stylesheet') {
                this.media = 'print';
                this.setAttribute('data-non-blocking', 'true');
                this.onload = function() {
                  this.media = 'all';
                };
                setTimeout(() => {
                  if (this.media === 'print') {
                    this.media = 'all';
                  }
                }, 200);
              }
            };
          }
          return element;
        };
        
        // Method 3: Process any existing CSS links immediately
        const processCSS = () => {
          document.querySelectorAll('link[rel="stylesheet"]:not([data-non-blocking])').forEach(link => {
            link.setAttribute('data-non-blocking', 'true');
            link.media = 'print';
            link.onload = function() {
              this.media = 'all';
            };
            setTimeout(() => {
              if (link.media === 'print') {
                link.media = 'all';
              }
            }, 200);
          });
        };
        
        // Process immediately and on DOM ready
        processCSS();
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', processCSS, { once: true });
        }
      })();
    </script>
    
    <!-- Load ONLY critical scripts - defer all non-critical chunks -->
    <!-- This ensures static HTML paints first, then only critical JS executes -->
    <script type="module" src="/src/main.tsx" defer></script>
    <script>
      // Defer all non-critical JS chunks until after LCP
      // Only react-vendor and index chunks are critical - everything else waits
      (function() {
        const CRITICAL_CHUNKS = ['main.tsx', 'react-vendor', 'index'];
        
        const isCritical = (src) => {
          return CRITICAL_CHUNKS.some(chunk => src.includes(chunk));
        };
        
        const deferNonCriticalChunks = () => {
          // Find all module scripts
          const scripts = Array.from(document.querySelectorAll('script[type="module"]'));
          scripts.forEach(script => {
            const src = script.src || script.getAttribute('src');
            if (src && !isCritical(src) && !script.hasAttribute('data-critical')) {
              // Mark and defer non-critical chunks
              script.setAttribute('data-non-critical', 'true');
              script.remove();
              // Load after LCP completes (3 seconds)
              setTimeout(() => {
                const newScript = document.createElement('script');
                newScript.type = 'module';
                newScript.src = src;
                newScript.defer = true;
                document.head.appendChild(newScript);
              }, 3000);
            }
          });
        };
        
        // Intercept dynamically added scripts from Vite
        const observer = new MutationObserver((mutations) => {
          mutations.forEach((mutation) => {
            mutation.addedNodes.forEach((node) => {
              if (node.nodeName === 'SCRIPT') {
                const script = node as HTMLScriptElement;
                if (script.type === 'module') {
                  const src = script.src || script.getAttribute('src');
                  if (src && !isCritical(src) && !script.hasAttribute('data-critical')) {
                    script.setAttribute('data-non-critical', 'true');
                    const scriptSrc = src;
                    script.remove();
                    setTimeout(() => {
                      const newScript = document.createElement('script');
                      newScript.type = 'module';
                      newScript.src = scriptSrc;
                      newScript.defer = true;
                      document.head.appendChild(newScript);
                    }, 3000);
                  }
                }
              }
            });
          });
        });
        
        observer.observe(document.head, { childList: true, subtree: true });
        
        // Run after delays to catch Vite-injected scripts
        setTimeout(deferNonCriticalChunks, 50);
        setTimeout(deferNonCriticalChunks, 200);
        setTimeout(deferNonCriticalChunks, 500);
      })();
    </script>
    <script>
      // Hide critical content once React hydrates (prevents duplicate content)
      // This ensures smooth transition from static HTML to React
      (function() {
        const root = document.getElementById('root');
        const criticalContent = document.querySelector('.critical-content');
        if (root && criticalContent) {
          // Watch for React to hydrate
          const observer = new MutationObserver(() => {
            if (root.children.length > 0) {
              criticalContent.style.display = 'none';
              observer.disconnect();
            }
          });
          observer.observe(root, { childList: true, subtree: true });
          
          // Fallback: hide after 3 seconds if React hasn't loaded
          setTimeout(() => {
            if (root.children.length === 0) {
              criticalContent.style.display = 'none';
            }
          }, 3000);
        }
      })();
    </script>
  </body>
</html>
