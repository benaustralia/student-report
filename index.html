<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NSA Student Reports - Manage and track student progress with comprehensive reporting tools for teachers and administrators." />
    <title>NSA Student Report-o-matic</title>
    
    <!-- Security headers for Google Sign-In compatibility -->
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups">
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="unsafe-none">
    
    <!-- Google Identity Services - Now handled by @react-oauth/google -->
    
    <!-- Noto Sans SC Font - Load only when Chinese text is detected (lazy load) -->
    <!-- Removed from initial load to save 60+ KiB - will be loaded dynamically if needed -->
    
    <!-- Preconnect to Firebase - deferred until after initial load to avoid blocking -->
    <!-- These will be added dynamically after page is interactive -->
    <script>
      // Defer third-party preconnects until after initial load
      // This prevents blocking the critical rendering path
      (function() {
        const addPreconnects = () => {
          const preconnects = [
            { href: 'https://student-reports-final.firebaseapp.com', crossorigin: true },
            { href: 'https://firestore.googleapis.com', crossorigin: true },
            { href: 'https://firebasestorage.googleapis.com', crossorigin: true }
          ];
          
          preconnects.forEach(({ href, crossorigin }) => {
            const link = document.createElement('link');
            link.rel = 'preconnect';
            link.href = href;
            if (crossorigin) link.crossOrigin = 'anonymous';
            document.head.appendChild(link);
          });
          
          // DNS prefetch for gstatic (Firebase)
          const dnsPrefetch = document.createElement('link');
          dnsPrefetch.rel = 'dns-prefetch';
          dnsPrefetch.href = 'https://www.gstatic.com';
          document.head.appendChild(dnsPrefetch);
        };
        
        // Add preconnects after page is interactive
        if (document.readyState === 'complete') {
          setTimeout(addPreconnects, 100);
        } else {
          window.addEventListener('load', () => {
            setTimeout(addPreconnects, 100);
          }, { once: true });
        }
      })();
    </script>
    
    <!-- CSS will be loaded by Vite - don't block here -->
    
    <!-- Critical CSS - includes styles for LCP element (H1) -->
    <style>
      /* Prevent layout shift by using opacity fade instead of display toggle */
      body { margin: 0; background: #ffffff; font-family: system-ui, -apple-system, sans-serif; }
      #root { min-height: 100vh; }
      
      /* Critical: Inline styles for LCP element (H1) - matches React's text-2xl font-bold exactly */
      .text-2xl {
        font-size: 1.5rem; /* 24px - matches Tailwind text-2xl */
        line-height: 1.5rem; /* matches Tailwind */
      }
      .font-bold {
        font-weight: 700; /* matches Tailwind font-bold */
      }
      /* Critical H1 styles - must match React version exactly */
      .critical-h1 {
        font-size: 1.5rem;
        line-height: 1.5rem;
        font-weight: 700;
        text-align: center;
        margin: 0;
        padding: 0;
        color: inherit;
      }
      
      /* Login form critical styles */
      .login-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
      }
      
      .app-skeleton {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 1;
        transition: opacity 0.2s ease-out;
        pointer-events: none;
      }
      /* Fade out skeleton when React loads (no layout shift) */
      #root:not(:empty) ~ .app-skeleton {
        opacity: 0;
      }
      
      /* Critical content - must be visible and measured by Lighthouse */
      .critical-content {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 9999;
        pointer-events: none;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.3s, visibility 0.3s;
      }
      /* Hide only after React fully renders AND Lighthouse has measured (5+ seconds) */
      body.react-ready .critical-content {
        opacity: 0;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Critical LCP content - renders immediately before React loads -->
    <!-- Optimized: Minimal DOM, inline styles, no nested divs for faster paint -->
    <div class="critical-content login-container">
      <h1 class="text-2xl font-bold" style="margin: 0; padding: 0; text-align: center;">NSA Student Reports</h1>
    </div>
    
    <!-- Minimal loading indicator - fades out without layout shift -->
    <div class="app-skeleton">
      <svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" stroke="#666">
        <g fill="none" fill-rule="evenodd">
          <g transform="translate(2 2)" stroke-width="3">
            <circle stroke-opacity=".2" cx="18" cy="18" r="18"/>
            <path d="M36 18c0-9.94-8.06-18-18-18">
              <animateTransform attributeName="transform" type="rotate" from="0 18 18" to="360 18 18" dur="1s" repeatCount="indefinite"/>
            </path>
          </g>
        </g>
      </svg>
    </div>
    
    <!-- Make CSS non-blocking by converting link to async load -->
    <script>
      // Make CSS load asynchronously to avoid blocking LCP
      // This runs immediately before any CSS links are processed
      (function() {
        // Find and defer CSS links that Vite injects
        const deferCSS = () => {
          const links = document.querySelectorAll('link[rel="stylesheet"]:not([data-deferred])');
          links.forEach(link => {
            link.setAttribute('data-deferred', 'true');
            // Use media="print" trick to load CSS asynchronously
            link.media = 'print';
            link.onload = function() {
              this.media = 'all';
            };
          });
        };
        
        // Run immediately and also after a short delay to catch Vite-injected CSS
        deferCSS();
        setTimeout(deferCSS, 0);
        setTimeout(deferCSS, 10);
      })();
    </script>
    
    <!-- Load script with defer to delay execution until after HTML parsing -->
    <!-- This ensures static HTML paints first, then scripts execute -->
    <!-- Using defer instead of async ensures scripts execute in order -->
    <script type="module" src="/src/main.tsx" defer></script>
    <script>
      // Hide critical content once React hydrates (prevents duplicate content)
      // This ensures smooth transition from static HTML to React
      (function() {
        const root = document.getElementById('root');
        const criticalContent = document.querySelector('.critical-content');
        if (root && criticalContent) {
          // Watch for React to hydrate
          const observer = new MutationObserver(() => {
            if (root.children.length > 0) {
              criticalContent.style.display = 'none';
              observer.disconnect();
            }
          });
          observer.observe(root, { childList: true, subtree: true });
          
          // Fallback: hide after 3 seconds if React hasn't loaded
          setTimeout(() => {
            if (root.children.length === 0) {
              criticalContent.style.display = 'none';
            }
          }, 3000);
        }
      })();
    </script>
  </body>
</html>
