<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/favicon.svg" as="image" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NSA Student Report-o-matic</title>
    
    <!-- Security headers for Google Sign-In compatibility -->
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups">
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="unsafe-none">
    
    <!-- Google Identity Services - Now handled by @react-oauth/google -->
    
    <!-- Noto Sans SC Font for Chinese text support with optimized loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Font loads async, display=swap prevents blocking -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'; this.onload=null;">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet"></noscript>
    
    <!-- Preconnect to Firebase for faster auth/data loading -->
    <link rel="preconnect" href="https://student-reports-final.firebaseapp.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin>
    <link rel="dns-prefetch" href="https://www.gstatic.com">
    
    <!-- Preload critical assets for faster LCP -->
    <link rel="modulepreload" href="/src/main.tsx">
    <link rel="preload" href="/src/index.css" as="style">
    
    <!-- Critical CSS - minimal to prevent CLS -->
    <style>
      /* Prevent layout shift by using opacity fade instead of display toggle */
      body { margin: 0; background: #ffffff; }
      #root { min-height: 100vh; }
      .app-skeleton {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 1;
        transition: opacity 0.2s ease-out;
        pointer-events: none;
      }
      /* Fade out skeleton when React loads (no layout shift) */
      #root:not(:empty) ~ .app-skeleton {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Minimal loading indicator - fades out without layout shift -->
    <div class="app-skeleton">
      <svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" stroke="#666">
        <g fill="none" fill-rule="evenodd">
          <g transform="translate(2 2)" stroke-width="3">
            <circle stroke-opacity=".2" cx="18" cy="18" r="18"/>
            <path d="M36 18c0-9.94-8.06-18-18-18">
              <animateTransform attributeName="transform" type="rotate" from="0 18 18" to="360 18 18" dur="1s" repeatCount="indefinite"/>
            </path>
          </g>
        </g>
      </svg>
    </div>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
