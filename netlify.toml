[build]
  publish = "dist"
  command = "cd netlify/functions && npm install && cd ../.. && bun install && bun run build"
  functions = "netlify/functions"

[functions]
  included_files = ["netlify/functions/data/**"]

[build.environment]
  NODE_VERSION = "20"

# Production branch settings
[context.production]
  command = "cd netlify/functions && npm install && cd ../.. && bun install && bun run build"

# Development branch settings
[context.development]
  command = "cd netlify/functions && npm install && cd ../.. && bun install && bun run build"

# Redirects are now handled by public/_redirects file
# This provides better control over static asset serving
